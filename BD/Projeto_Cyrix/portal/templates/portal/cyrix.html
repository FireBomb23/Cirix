<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyrix Cybersecurity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #EAB308;
    --yellow-light: #FEF08A;
    --yellow-dark: #A16207;
    --slate-900: #0F172A;
    --slate-800: #1E293B;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748B;
    --slate-400: #94A3B8;
    --slate-300: #CBD5E1;
    --slate-200: #E2E8F0;
    --slate-100: #F1F5F9;
    --slate-50: #F8FAFC;
    --green: #22C55E;
    --red: #EF4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
  body { background-color: var(--slate-900); color: var(--slate-100); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  h1, h2, h3, .font-syne { font-family: 'Syne', sans-serif; font-weight: 700; }
  a { color: inherit; text-decoration: none; }
  
  /* UTILS */
  .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .align-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .flex-1 { flex: 1; }
  .grid { display: grid; gap: 1.5rem; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .text-center { text-align: center; }
  
  /* HEADER */
  .header { background-color: rgba(15, 23, 42, 0.8); border-bottom: 1px solid var(--slate-800); position: sticky; top: 0; backdrop-filter: blur(8px); z-index: 100; padding: 1rem 0; }
  .logo { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; color: var(--yellow); }
  .logo span { color: var(--slate-100); }
  .nav-links { display: flex; gap: 2rem; }
  .nav-item { cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; color: var(--slate-400); }
  .nav-item:hover, .nav-item.active { color: var(--yellow); }
  
  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; font-weight: 600; font-size: 0.95rem; border-radius: 0.375rem; border: none; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background-color: var(--yellow); color: var(--slate-900); }
  .btn-primary:hover { background-color: #F59E0B; transform: translateY(-1px); }
  .btn-outline { background-color: transparent; color: var(--slate-100); border: 1px solid var(--slate-700); }
  .btn-outline:hover { background-color: var(--slate-800); border-color: var(--slate-400); }
  .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }
  
  /* FOOTER */
  .footer { background-color: #0B0F19; border-top: 1px solid var(--slate-800); padding: 2rem 0; font-size: 0.875rem; color: var(--slate-400); text-align: center; margin-top: auto; }
  
  /* INPUTS */
  .input { width: 100%; padding: 0.75rem 1rem; background-color: var(--slate-800); border: 1px solid var(--slate-700); border-radius: 0.375rem; color: var(--slate-100); font-size: 0.95rem; transition: border-color 0.2s; }
  .input:focus { outline: none; border-color: var(--yellow); }
  
  /* HOME */
  .hero { padding: 5rem 0; text-align: center; max-width: 800px; margin: 0 auto; }
  .hero h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 1.5rem; letter-spacing: -0.02em; }
  .hero p { font-size: 1.125rem; color: var(--slate-400); margin-bottom: 2rem; line-height: 1.6; }
  .hero-buttons { display: flex; gap: 1rem; justify-content: center; }
  .feature-card { background-color: var(--slate-800); border: 1px solid var(--slate-700); padding: 2rem; border-radius: 0.5rem; }
  .feature-icon { width: 3rem; height: 3rem; border-radius: 0.375rem; background-color: rgba(234, 179, 8, 0.1); color: var(--yellow); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; }
  .feature-card h3 { margin-bottom: 0.75rem; font-size: 1.25rem; }
  .feature-card p { color: var(--slate-400); font-size: 0.95rem; line-height: 1.5; }
  
  /* PAGES CONTAINER */
  .page-view { padding: 3rem 0; }
  .page-title { font-size: 2.25rem; margin-bottom: 1rem; }
  .page-subtitle { color: var(--slate-400); margin-bottom: 2.5rem; font-size: 1.05rem; }
  
  /* TEAM */
  .team-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .team-card { background-color: var(--slate-800); border: 1px solid var(--slate-700); border-radius: 0.5rem; overflow: hidden; text-align: center; }
  .team-img { width: 100%; height: 200px; background-color: var(--slate-700); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--slate-400); }
  .team-info { padding: 1.25rem; }
  .team-role { font-size: 0.85rem; color: var(--yellow); text-transform: uppercase; font-weight: 600; margin-top: 0.25rem; }
  
  /* NEWS */
  .news-card { background-color: var(--slate-800); border: 1px solid var(--slate-700); border-radius: 0.5rem; overflow: hidden; display: flex; flex-direction: column; }
  .news-img { height: 180px; background-color: var(--slate-700); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--slate-400); }
  .news-content { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
  .news-meta { font-size: 0.8rem; color: var(--slate-400); margin-bottom: 0.5rem; }
  .news-title { font-size: 1.25rem; margin-bottom: 0.75rem; line-height: 1.3; }
  .news-desc { color: var(--slate-400); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.25rem; }
  
  /* FORMS */
  .form-container { max-width: 500px; margin: 0 auto; background-color: var(--slate-800); border: 1px solid var(--slate-700); padding: 2.5rem; border-radius: 0.5rem; }
  .form-group { margin-bottom: 1.25rem; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--slate-300); }
  
  /* DASHBOARD CONTAINER */
  .dashboard-layout { display: grid; grid-template-columns: 240px 1fr; gap: 2rem; min-height: 500px; }
  .sidebar { border-right: 1px solid var(--slate-800); padding-right: 1.5rem; }
  .sidebar-menu { display: flex; flex-direction: column; gap: 0.5rem; }
  .sidebar-item { padding: 0.75rem 1rem; border-radius: 0.375rem; font-weight: 500; font-size: 0.95rem; cursor: pointer; color: var(--slate-400); transition: all 0.2s; }
  .sidebar-item:hover, .sidebar-item.active { background-color: var(--slate-800); color: var(--slate-50); }
  .sidebar-item.active { border-left: 3px solid var(--yellow); border-radius: 0 0.375rem 0.375rem 0; }
  
  /* METRIC CARDS */
  .metric-card { background-color: var(--slate-800); border: 1px solid var(--slate-700); padding: 1.5rem; border-radius: 0.5rem; }
  .metric-label { font-size: 0.85rem; color: var(--slate-400); font-weight: 500; text-transform: uppercase; margin-bottom: 0.25rem; }
  .metric-value { font-size: 2rem; font-weight: 700; color: var(--slate-50); }
  
  /* TABLES */
  .table-wrapper { background-color: var(--slate-800); border: 1px solid var(--slate-700); border-radius: 0.5rem; overflow: hidden; }
  .table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
  .table th { background-color: rgba(15, 23, 42, 0.4); padding: 1rem; font-weight: 600; color: var(--slate-300); border-bottom: 1px solid var(--slate-700); }
  .table td { padding: 1rem; border-bottom: 1px solid var(--slate-700); color: var(--slate-200); }
  .table tr:last-child td { border-bottom: none; }
  
  /* BADGES */
  .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .badge-success { background-color: rgba(34, 197, 94, 0.1); color: var(--green); }
  .badge-warning { background-color: rgba(234, 179, 8, 0.1); color: var(--yellow); }
  .badge-danger { background-color: rgba(239, 68, 68, 0.1); color: var(--red); }
  
  /* TOAST */
  .toast { position: fixed; bottom: 2rem; right: 2rem; background-color: var(--slate-800); border-left: 4px solid var(--yellow); padding: 1rem 1.5rem; border-radius: 0.25rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 0.75rem; z-index: 1000; transform: translateY(150%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast.show { transform: translateY(0); }
  
  /* COMPLIANCE BARS */
  .bar-container { background-color: var(--slate-700); height: 0.5rem; border-radius: 9999px; overflow: hidden; width: 100px; }
  .bar-fill { height: 100%; background-color: var(--yellow); }
  
  /* CHAT COMPONENT */
  .chat-box { background-color: var(--slate-800); border: 1px solid var(--slate-700); border-radius: 0.5rem; display: flex; flex-direction: column; height: 400px; }
  .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
  .chat-msg { max-width: 80%; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.95rem; line-height: 1.4; }
  .chat-msg-in { background-color: var(--slate-700); color: var(--slate-100); align-self: flex-start; }
  .chat-msg-out { background-color: rgba(234, 179, 8, 0.15); color: var(--yellow-light); align-self: flex-end; border: 1px solid rgba(234, 179, 8, 0.3); }
  .msg-meta { font-size: 0.75rem; color: var(--slate-400); margin-top: 0.25rem; text-align: right; }
  .ticket-reply { padding: 1rem; border-top: 1px solid var(--slate-700); display: flex; gap: 0.75rem; }

  /* ===== DASHBOARD ADMIN (estilo claro, semelhante ao frontend) ===== */
  .dashx { background: var(--slate-100); color: var(--slate-900); border-radius: 14px; padding: 1.5rem; }
  .dashx .dhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
  .dashx .dhead h2 { color: #0f172a; font-size: 1.5rem; }
  .dashx .dhead p { color: var(--slate-600); font-size: 0.85rem; margin-top: 0.15rem; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.25rem; }
  .kpi { background: #fff; border: 1px solid var(--slate-200); border-radius: 12px; padding: 1.1rem 1.25rem; box-shadow: 0 1px 3px rgba(15,23,42,0.08); }
  .kpi .k-ic { float: right; width: 40px; height: 40px; border-radius: 10px; background: rgba(234,179,8,0.14); color: var(--yellow-dark); display: flex; align-items: center; justify-content: center; }
  .kpi .k-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--slate-500); }
  .kpi .k-val { font-size: 2rem; font-weight: 800; color: #0f172a; margin-top: 0.15rem; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .panel { background: #fff; border: 1px solid var(--slate-200); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,23,42,0.08); }
  .panel.span2 { grid-column: 1 / -1; }
  .panel-h { padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--slate-200); font-weight: 700; color: #0f172a; font-size: 0.95rem; }
  .panel-h .num { display: inline-flex; width: 24px; height: 24px; border-radius: 7px; background: var(--yellow); color: #0f172a; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; margin-right: 0.5rem; }
  .panel-b { padding: 0.4rem 1.25rem 0.9rem; }
  .dtable { width: 100%; border-collapse: collapse; }
  .dtable th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--slate-500); padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--slate-200); }
  .dtable td { padding: 0.55rem 0.25rem; border-bottom: 1px solid var(--slate-100); font-size: 0.9rem; color: var(--slate-700); }
  .dtable tr:last-child td { border-bottom: none; }
  .dbadge { display: inline-flex; padding: 0.15rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; text-transform: capitalize; }
  .b-green { background: #dcfce7; color: #15803d; } .b-yellow { background: #fef9c3; color: #a16207; }
  .b-red { background: #fee2e2; color: #b91c1c; } .b-blue { background: #dbeafe; color: #1d4ed8; } .b-gray { background: #e2e8f0; color: #475569; }
  .dbar { height: 8px; background: var(--slate-200); border-radius: 9999px; overflow: hidden; min-width: 70px; }
  .dbar > i { display: block; height: 100%; background: var(--yellow); border-radius: 9999px; }
  .rownum { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--slate-800); color: #fff; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2,1fr); } .panels { grid-template-columns: 1fr; } }

  /* ==========================================================
     DASHBOARD — RÉPLICA DO DESIGN REACT (sidebar escura fixa)
     ========================================================== */
  body.dash-mode { display: block; background: var(--slate-50); }
  body.dash-mode > .header, body.dash-mode > .footer { display: none !important; }
  body.dash-mode > #app { max-width: none; width: 100%; padding: 0; margin: 0; }

  .dash-layout { display: flex; min-height: 100vh; }
  .dsidebar { width: 264px; background: #020617; color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05); }
  .dsidebar-logo { padding: 1.375rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
  .dsidebar-logo:hover { background: rgba(255,255,255,0.03); }
  .dsidebar-logo .lg-brand { font-family: 'Syne', sans-serif; font-weight: 700; color: #fff; font-size: 1.05rem; }
  .dsidebar-logo .lg-sub { font-size: 0.62rem; color: var(--slate-500); margin-top: 0.1rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .dsidebar-user { padding: 1.125rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); }
  .dsidebar-user .u-name { font-weight: 600; font-size: 0.875rem; color: #fff; }
  .dsidebar-user .u-role { font-size: 0.68rem; color: var(--slate-500); margin-top: 0.15rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .dsidebar-nav { padding: 0.75rem 0; flex: 1; }
  .dsidebar-sec { padding: 0.75rem 1.5rem 0.375rem; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--slate-600); font-weight: 700; }
  .dsidebar-link { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 1.5rem; font-size: 0.875rem; font-weight: 500; color: var(--slate-400); transition: all 0.15s; background: none; border: none; cursor: pointer; font-family: inherit; width: 100%; text-align: left; border-left: 2px solid transparent; }
  .dsidebar-link:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .dsidebar-link.active { background: rgba(234,179,8,0.1); color: var(--yellow); border-left-color: var(--yellow); }
  .dsidebar-footer { padding: 1.25rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.06); }

  .dash-main { margin-left: 264px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .dash-topbar { background: #fff; border-bottom: 1px solid #EEF2F7; padding: 0 1.75rem; height: 4rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .dash-topbar-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--slate-900); }
  .dash-content { padding: 2rem 1.75rem; flex: 1; }

  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
  .stat-card { background: #fff; border: 1px solid var(--slate-200); border-radius: 14px; padding: 1.5rem; transition: box-shadow 0.2s, transform 0.2s; }
  .stat-card:hover { box-shadow: 0 4px 6px -1px rgba(0,0,0,.1); transform: translateY(-1px); }
  .stat-card .sc-label { font-size: 0.72rem; color: var(--slate-500); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
  .stat-card .sc-value { font-family: 'Syne', sans-serif; font-size: 2.25rem; font-weight: 800; color: var(--slate-900); line-height: 1; }

  .table-wrap { background: #fff; border: 1px solid var(--slate-200); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 1.5rem; }
  .table-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #EEF2F7; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
  .table-header h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--slate-900); }
  .table-scroll { overflow-x: auto; }
  .table-wrap table { width: 100%; border-collapse: collapse; }
  .table-wrap th { text-align: left; padding: 0.75rem 1.5rem; font-size: 0.68rem; font-weight: 700; color: var(--slate-500); text-transform: uppercase; letter-spacing: 0.07em; background: var(--slate-50); border-bottom: 1px solid var(--slate-200); }
  .table-wrap td { padding: 0.9rem 1.5rem; font-size: 0.875rem; border-bottom: 1px solid var(--slate-100); color: var(--slate-700); }
  .table-wrap tr:last-child td { border-bottom: none; }
  .table-wrap tbody tr:hover td { background: #FAFBFC; }

  .badge-green { background: #DCFCE7; color: #14532D; } .badge-yellow { background: #FEF9C3; color: #78350F; }
  .badge-red { background: #FEE2E2; color: #7F1D1D; } .badge-blue { background: #DBEAFE; color: #1E3A8A; }
  .badge-gray { background: #F1F5F9; color: #475569; } .badge-orange { background: #FFEDD5; color: #7C2D12; }

  .btn-outline-dark { background: transparent; border: 1.5px solid var(--slate-200); color: var(--slate-700); }
  .btn-outline-dark:hover { background: var(--slate-50); border-color: var(--slate-300); color: var(--slate-900); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #B91C1C; }
  .progress-bar { background: var(--slate-200); border-radius: 9999px; height: 0.5rem; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--yellow), #FDE047); border-radius: 9999px; }
  .progress-fill.green-fill { background: linear-gradient(90deg, #16A34A, #22C55E); }
  .progress-fill.red-fill { background: linear-gradient(90deg, #DC2626, #F87171); }
  .dash-list-row { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--slate-100); display: flex; justify-content: space-between; align-items: center; }
  .dash-list-row:last-child { border-bottom: none; }

  .dcard { background: #fff; border: 1px solid var(--slate-200); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .dcard h3 { color: var(--slate-900); font-size: 1rem; margin-bottom: 1rem; }
  .dlabel { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--slate-700); }
  .dinput { width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid var(--slate-200); border-radius: 0.5rem; font-size: 0.9rem; background: #fff; color: var(--slate-900); }
  .dinput:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(234,179,8,0.12); }
  .dash-empty { text-align: center; color: var(--slate-400); padding: 1.25rem; }
  .stat-card { border-top: 3px solid var(--yellow); }
  .stat-card .sc-value { letter-spacing: -0.02em; }
  .dcard > h3:first-child { border-left: 3px solid var(--yellow); padding-left: 0.65rem; }
  .table-header h3 { border-left: 3px solid var(--yellow); padding-left: 0.6rem; }
  .dash-content { animation: fadeUpDash 0.25s ease; }
  @keyframes fadeUpDash { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 1024px) { .dsidebar { transform: translateX(-100%); } .dash-main { margin-left: 0; } }
</style>
</head>
<body>

  <header class="header">
    <div class="container flex align-center justify-between">
      <div class="logo" onclick="navigate('home')" style="cursor:pointer">Cyrix<span>.</span></div>
      <nav class="nav-links" id="navLinks"></nav>
    </div>
  </header>

  <main class="flex-1 container page-view" id="app"></main>

  <footer class="footer">
    <div class="container">
      &copy; 2026 Cyrix Cybersecurity. Todos os direitos reservados. Projeto Académico Multimédia - ESTGV.
    </div>
  </footer>

  <div class="toast" id="toast">
    <span id="toastIcon"></span>
    <span id="toastText"></span>
  </div>

  <script>
    // ============================================================
    // INJEÇÃO DE DADOS DINÂMICOS DO DJANGO (FICHA 9)
    // ============================================================

      t.style.borderLeftColor = type === 'success' ? 'var(--green)' : 'var(--red)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);

    function nis2ResultHTML(done, total, faltam) {
      const pct = total ? Math.round(done / total * 100) : 0;
      let estado, cor;
      if (pct >= 80) { estado = 'Conforme'; cor = 'var(--green)'; }
      else if (pct >= 50) { estado = 'Em avaliação'; cor = 'var(--yellow)'; }
      else { estado = 'Com pendências'; cor = 'var(--red)'; }
      const recs = (faltam === null) ? '' : (faltam > 0
        ? `<p style="color:var(--slate-400);font-size:0.85rem;margin-top:1rem">Faltam <b style="color:var(--yellow)">${faltam}</b> medida(s). Priorize as não assinaladas para reduzir o risco.</p>`
        : `<p style="color:var(--green);font-size:0.9rem;margin-top:1rem">Excelente! Todas as medidas essenciais estão implementadas.</p>`);
      return `
        <h3 style="margin-bottom:1.5rem">Resultado</h3>
        <div style="text-align:center">
          <div style="font-size:3.5rem;font-weight:800;font-family:'Syne',sans-serif;color:${cor}">${pct}%</div>
          <div style="display:inline-block;padding:0.35rem 1rem;border-radius:9999px;background:${cor};color:#0f172a;font-weight:700;margin-top:0.5rem">${estado}</div>
        </div>
        <div class="bar-container" style="width:100%;margin-top:1.5rem;height:0.75rem"><div class="bar-fill" style="width:${pct}%;background:${cor}"></div></div>
        <p style="color:var(--slate-400);font-size:0.9rem;margin-top:1rem">${done} de ${total} medidas implementadas.</p>
        ${recs}
        <button class="btn btn-primary btn-sm" style="margin-top:1.5rem;width:100%" onclick="navigate('contact')">Falar com um consultor Cyrix</button>`;
    }

    // CLIENT DASHBOARD — dados REAIS do cliente autenticado (via SQL/Django)
    function setClientSection(id) {
      if (id === 'mensagens') { carregarChatCliente(); return; }
      state.clientSection = id; render();
    }
    function val(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
    function bolhasChat(msgs) {
      if (!msgs || !msgs.length) return `<div class="dash-empty">Ainda não há mensagens. Escreve a primeira!</div>`;
      return msgs.map(m => {
        const meu = m.autor_id === state.user.id;
        return `<div style="display:flex;justify-content:${meu ? 'flex-end' : 'flex-start'};margin-bottom:0.6rem"><div style="max-width:72%;padding:0.55rem 0.85rem;border-radius:12px;background:${meu ? 'var(--yellow-light)' : '#fff'};border:1px solid var(--slate-200)"><div style="font-size:0.9rem;color:#0f172a">${m.texto}</div><div style="font-size:0.66rem;color:var(--slate-400);margin-top:0.25rem">${m.autor} · ${m.data}</div></div></div>`;
      }).join('');
    }
    function carregarChatCliente() {
      postDjango({ action: 'chat_cliente', client_id: state.user.id }, (d) => { state.chatData = d.dados || { mensagens: [] }; state.clientSection = 'mensagens'; render(); });
    }
    function renderChatCliente() {
      const c = state.chatData || { mensagens: [] };
      return `<div class="dcard" style="display:flex;flex-direction:column;height:62vh">
          <h3>Mensagens com a equipa Cyrix</h3>
          <div style="flex:1;overflow-y:auto;background:var(--slate-50);border-radius:8px;padding:1rem;margin:0.75rem 0">${bolhasChat(c.mensagens)}</div>
          <div style="display:flex;gap:0.5rem"><input class="dinput" id="msg_input" placeholder="Escreve uma mensagem..." onkeydown="if(event.key==='Enter')enviarMensagemCliente()"><button class="btn btn-primary btn-sm" onclick="enviarMensagemCliente()">Enviar</button></div>
        </div>`;
    }
    function enviarMensagemCliente() {
      const texto = val('msg_input');
      if (!texto) return;
      postDjango({ action: 'enviar_mensagem', conversation_id: state.chatData.conversation_id, sender_id: state.user.id, content: texto }, () => { carregarChatCliente(); });
    }
    function recarregarCliente(section) {
      postDjango({ action: 'dados_cliente', id: state.user.id }, (d) => { state.clienteData = d.dados || state.clienteData; if (section) state.clientSection = section; render(); });
    }
    function criarTicket() {
      const titulo = val('t_titulo');
      if (!titulo) { toast('Indica o assunto do ticket.', 'error'); return; }
      postDjango({ action: 'criar_ticket', client_id: state.user.id, titulo, categoria: val('t_categoria'), prioridade: val('t_prioridade'), descricao: val('t_desc') }, () => { toast('Ticket criado com sucesso.'); recarregarCliente('tickets'); });
    }
    function criarPedido() {
      const titulo = val('p_titulo');
      if (!titulo) { toast('Indica o título do pedido.', 'error'); return; }
      postDjango({ action: 'criar_pedido', client_id: state.user.id, titulo, descricao: val('p_desc') }, () => { toast('Pedido submetido com sucesso.'); recarregarCliente('pedidos'); });
    }
    function guardarConta() {
      const nome = val('c_nome'), email = val('c_email');
      if (!nome || !email) { toast('Preenche nome e email.', 'error'); return; }
      postDjango({ action: 'atualizar_conta', id: state.user.id, nome, email }, () => { toast('Conta atualizada.'); state.user.nome = nome; state.user.email = email; render(); });
    }
    function criarAtivo() {
      const nome = val('a_nome');
      if (!nome) { toast('Indica o nome do ativo.', 'error'); return; }
      postDjango({ action: 'criar_ativo', client_id: state.user.id, nome, tipo: val('a_tipo'), quantidade: val('a_qtd') || 1, local: val('a_local'), criticidade: val('a_crit'), notas: '' }, () => { toast('Ativo registado.'); recarregarCliente('ativos'); });
    }
    function criarIncidente() {

      const menu = [{ id: 'dashboard', label: 'Dashboard', icon: '📊' }, { id: 'mensagens', label: 'Mensagens', icon: '💬' }];
      if (isAdmin) menu.push({ id: 'utilizadores', label: 'Utilizadores', icon: '👥' });
      menu.push({ id: 'clientes', label: 'Clientes', icon: '🏢' }, { id: 'tickets', label: 'Tickets', icon: '🎫' }, { id: 'pedidos', label: 'Pedidos', icon: '📋' }, { id: 'documentos', label: 'Documentos', icon: '📄' }, { id: 'servicos', label: 'Serviços Anuais', icon: '🔄' }, { id: 'contactos', label: 'Contactos', icon: '📬' });
      if (isAdmin) menu.push({ id: 'auditoria', label: 'Log de Auditoria', icon: '🔍' });
      menu.push({ id: 'conta', label: 'A Minha Conta', icon: '👤' });
      const nav = menu.map(m => `<button class="dsidebar-link ${sec === m.id ? 'active' : ''}" onclick="setAdminSection('${m.id}')"><span>${m.icon}</span> ${m.label}</button>`).join('');

      const g = state.gestaoData || {};
      const stMapA = { open: ['badge-blue', 'Aberto'], 'in-progress': ['badge-yellow', 'Em Progresso'], resolved: ['badge-green', 'Resolvido'], closed: ['badge-gray', 'Fechado'], pending: ['badge-gray', 'Pendente'], completed: ['badge-green', 'Concluído'], overdue: ['badge-red', 'Atrasado'], cancelled: ['badge-red', 'Cancelado'] };
      const admSb = (s) => { const m = stMapA[s] || ['badge-gray', s || '—']; return `<span class="badge ${m[0]}">${m[1]}</span>`; };
      const nClientes = (g.clientes || []).filter(c => c.active).length;
      const nMsg = (g.contactos || []).filter(c => !c.lido).length;
      const nTickets = (g.tickets || []).filter(t => t.estado !== 'resolved' && t.estado !== 'closed').length;
      const nServ = (g.servicos || []).filter(s => s.estado === 'in-progress').length;
      const admTList = (g.tickets && g.tickets.length) ? g.tickets.slice(0, 3).map(t => `<div class="dash-list-row"><div><div style="font-size:0.875rem;font-weight:500;color:#0f172a">${t.titulo}</div><div style="font-size:0.75rem;color:var(--slate-500)">${t.cliente}</div></div>${admSb(t.estado)}</div>`).join('') : `<div style="padding:2rem;text-align:center;color:var(--slate-400)">Sem tickets.</div>`;
      const admSList = (g.servicos && g.servicos.length) ? g.servicos.slice(0, 3).map(s => `<div style="padding:0.75rem 1.5rem;border-bottom:1px solid var(--slate-100)"><div style="display:flex;justify-content:space-between;margin-bottom:0.375rem"><span style="font-size:0.875rem;color:#0f172a">${s.cliente}</span>${admSb(s.estado)}</div><div class="progress-bar"><div class="progress-fill ${s.estado === 'completed' ? 'green-fill' : s.estado === 'overdue' ? 'red-fill' : ''}" style="width:${s.progresso}%"></div></div><div style="font-size:0.7rem;color:var(--slate-500);margin-top:0.25rem">${s.progresso}%</div></div>`).join('') : `<div style="padding:2rem;text-align:center;color:var(--slate-400)">Sem serviços.</div>`;
      const adminHome = `<div class="stat-cards">
          <div class="stat-card"><div class="sc-label">Total Clientes</div><div class="sc-value">${nClientes}</div></div>
          <div class="stat-card"><div class="sc-label">Mensagens Novas</div><div class="sc-value">${nMsg}</div></div>
          <div class="stat-card"><div class="sc-label">Tickets Abertos</div><div class="sc-value">${nTickets}</div></div>
          <div class="stat-card"><div class="sc-label">Serviços Ativos</div><div class="sc-value">${nServ}</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem">
          <div class="table-wrap"><div class="table-header"><h3>Tickets Recentes</h3><button class="btn btn-outline-dark btn-sm" onclick="setAdminSection('tickets')">Ver todos</button></div>${admTList}</div>
          <div class="table-wrap"><div class="table-header"><h3>Serviços Anuais</h3><button class="btn btn-outline-dark btn-sm" onclick="setAdminSection('servicos')">Ver todos</button></div>${admSList}</div>
        </div>`;

      let content;
      if (sec === 'mensagens') content = renderChatAdmin();
      else if (sec === 'utilizadores' && isAdmin) content = renderGestaoUtilizadores();
      else if (sec === 'clientes') content = renderGestaoClientes();
      else if (sec === 'tickets') content = renderGestaoTickets();
      else if (sec === 'pedidos') content = renderGestaoPedidos();
      else if (sec === 'documentos') content = renderGestaoDocumentos();
      else if (sec === 'servicos') content = renderGestaoServicos();
      else if (sec === 'contactos') content = renderGestaoContactos();
      else if (sec === 'auditoria' && isAdmin) content = renderGestaoAuditoria();
      else if (sec === 'conta') content = renderGestaoConta();
      else content = adminHome + '<h2 style="font-size:1.4rem;margin:0.5rem 0 1.25rem;color:#0f172a">Métricas de Base de Dados (Ficha 9)</h2>' + ficha9;

      return `
        <div class="dash-layout">
          <aside class="dsidebar">
            <div class="dsidebar-logo" onclick="navigate('home')"><span style="font-size:1.4rem">🛡️</span><div><div class="lg-brand">Cyrix</div><div class="lg-sub">${isAdmin ? 'Administração' : 'Gestão'}</div></div></div>
            <div class="dsidebar-user"><div class="u-name">${state.user.nome}</div><div class="u-role">${state.user.perfil}</div></div>
            <nav class="dsidebar-nav"><div class="dsidebar-sec">Portal</div>${nav}</nav>
            <div class="dsidebar-footer"><button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">Terminar Sessão</button></div>
          </aside>
          <div class="dash-main">
            <div class="dash-topbar"><div class="dash-topbar-title">${secTitles[sec] || 'Painel'}</div><div style="font-size:0.78rem;color:var(--slate-500)">Dados reais · PostgreSQL</div></div>
            <div class="dash-content">${content}</div>
          </div>
        </div>${renderTicketModal()}`;
    }

    // ===== Secções de gestão (dados reais via SQL) =====
    function tbl2(headers, rowsHtml, title) {
      const head = title ? `<div class="table-header"><h3>${title}</h3></div>` : '';
      return `<div class="table-wrap">${head}<div class="table-scroll"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`;
    }
    function renderGestaoUtilizadores() {
      const us = (state.gestaoData && state.gestaoData.utilizadores) || [];
      const rows = us.length ? us.map(u => `<tr><td>${u.id}</td><td><strong>${u.nome}</strong></td><td>${u.email}</td><td><span class="badge badge-yellow">${u.perfil}</span></td><td><button class="btn btn-sm btn-outline-dark" onclick="editarUtilizador(${u.id})">Editar</button> <button class="btn btn-sm btn-danger" onclick="eliminarUtilizador(${u.id})">Apagar</button></td></tr>`).join('') : `<tr><td colspan="5" class="dash-empty">Sem utilizadores.</td></tr>`;
      return `
        <div class="dcard">
          <h3 id="u_form_title">Criar utilizador</h3>
          <input type="hidden" id="u_id" value="">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
            <div><label class="dlabel">Nome</label><input class="dinput" id="u_nome"></div>
            <div><label class="dlabel">Email</label><input class="dinput" type="email" id="u_email"></div>
            <div><label class="dlabel">Perfil</label><select class="dinput" id="u_perfil"><option>Administrador</option><option>Colaborador</option><option>Cliente</option></select></div>
            <div id="u_pass_group"><label class="dlabel">Palavra-passe</label><input class="dinput" type="password" id="u_pass"></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="guardarUtilizador()">Guardar</button>
          <button class="btn btn-outline-dark btn-sm" onclick="render()">Limpar</button>
        </div>
        ${tbl2(['ID', 'Nome', 'Email', 'Perfil', 'Ações'], rows, 'Utilizadores registados')}`;
    }
    function renderGestaoClientes() {
      const cs = (state.gestaoData && state.gestaoData.clientes) || [];
      const rows = cs.length ? cs.map(c => `<tr><td>${c.id}</td><td><strong>${c.nome}</strong></td><td>${c.email}</td><td>${c.empresa || '—'}</td><td><span class="badge ${c.active ? 'badge-green' : 'badge-red'}">${c.active ? 'Ativo' : 'Inativo'}</span></td></tr>`).join('') : `<tr><td colspan="5" class="dash-empty">Sem clientes.</td></tr>`;
      return tbl2(['ID', 'Nome', 'Email', 'Empresa', 'Estado'], rows, 'Clientes registados');
    }
    function estadoSelect(estados, atual, fn, id) {
      return `<select class="dinput" style="padding:0.3rem 0.5rem;font-size:0.8rem;width:auto" onchange="${fn}(${id}, this.value)">${estados.map(e => `<option value="${e[0]}" ${e[0] === atual ? 'selected' : ''}>${e[1]}</option>`).join('')}</select>`;
    }
    function renderGestaoTickets() {
      const ts = (state.gestaoData && state.gestaoData.tickets) || [];
      const est = [['open', 'Aberto'], ['in-progress', 'Em Progresso'], ['resolved', 'Resolvido'], ['closed', 'Fechado']];
      const rows = ts.length ? ts.map(t => `<tr><td>${t.id}</td><td><strong>${t.titulo}</strong></td><td>${t.cliente}</td><td><span class="badge badge-gray">${t.categoria}</span></td><td>${t.prioridade}</td><td>${estadoSelect(est, t.estado, 'atualizarEstadoTicket', t.id)}</td><td><button class="btn btn-sm btn-outline-dark" onclick="abrirTicketChat(${t.id})">💬 Chat</button></td></tr>`).join('') : `<tr><td colspan="7" class="dash-empty">Sem tickets.</td></tr>`;
      return tbl2(['ID', 'Assunto', 'Cliente', 'Categoria', 'Prioridade', 'Estado', 'Chat'], rows, 'Tickets de suporte');
    }
    function renderGestaoPedidos() {
      const ps = (state.gestaoData && state.gestaoData.pedidos) || [];
      const est = [['pending', 'Pendente'], ['in-progress', 'Em Progresso'], ['completed', 'Concluído'], ['cancelled', 'Cancelado']];
      const rows = ps.length ? ps.map(p => `<tr><td>${p.id}</td><td><strong>${p.titulo}</strong></td><td>${p.cliente}</td><td>${p.data || '—'}</td><td>${estadoSelect(est, p.estado, 'atualizarEstadoPedido', p.id)}</td></tr>`).join('') : `<tr><td colspan="5" class="dash-empty">Sem pedidos.</td></tr>`;
      return tbl2(['ID', 'Pedido', 'Cliente', 'Data', 'Estado'], rows, 'Pedidos de serviço');
    }
    function renderGestaoDocumentos() {
      const ds = (state.gestaoData && state.gestaoData.documentos) || [];
      const rows = ds.length ? ds.map(d => `<tr><td>${d.id}</td><td><strong>${d.nome}</strong></td><td>${d.cliente}</td><td><span class="badge badge-blue">${d.categoria}</span></td><td>${d.data || '—'}</td><td><button class="btn btn-sm btn-danger" onclick="eliminarDocumento(${d.id})">Apagar</button></td></tr>`).join('') : `<tr><td colspan="6" class="dash-empty">Sem documentos.</td></tr>`;
      return tbl2(['ID', 'Nome', 'Cliente', 'Categoria', 'Data', 'Ação'], rows, 'Documentos');
    }
    function renderGestaoServicos() {
      const ss = (state.gestaoData && state.gestaoData.servicos) || [];
      const est = [['pending', 'Pendente'], ['in-progress', 'Em Progresso'], ['completed', 'Concluído'], ['overdue', 'Atrasado'], ['cancelled', 'Cancelado']];
      const rows = ss.length ? ss.map(s => `<tr><td>${s.id}</td><td><strong>${s.servico}</strong></td><td>${s.cliente}</td><td>${s.progresso}%</td><td>${s.prazo || '—'}</td><td>${estadoSelect(est, s.estado, 'atualizarEstadoServico', s.id)}</td></tr>`).join('') : `<tr><td colspan="6" class="dash-empty">Sem serviços anuais.</td></tr>`;
      return tbl2(['ID', 'Serviço', 'Cliente', 'Progresso', 'Prazo', 'Estado'], rows, 'Serviços anuais');
    }
    function renderGestaoContactos() {
      const cs = (state.gestaoData && state.gestaoData.contactos) || [];
      const rows = cs.length ? cs.map(c => `<tr><td>${c.id}</td><td><strong>${c.nome}</strong></td><td>${c.email}</td><td>${c.empresa}</td><td style="max-width:260px">${c.mensagem}</td><td>${c.lido ? '<span class="badge badge-green">Lido</span>' : '<span class="badge badge-yellow">Novo</span>'}</td><td>${c.lido ? '—' : `<button class="btn btn-sm btn-outline-dark" onclick="marcarContactoLido(${c.id})">Marcar lido</button>`}</td></tr>`).join('') : `<tr><td colspan="7" class="dash-empty">Sem contactos.</td></tr>`;
      return tbl2(['ID', 'Nome', 'Email', 'Empresa', 'Mensagem', 'Estado', 'Ação'], rows, 'Mensagens de contacto (site público)');
    }
    function renderGestaoAuditoria() {
      const as = (state.gestaoData && state.gestaoData.auditoria) || [];
      const sevMap = { info: 'badge-blue', warning: 'badge-yellow', critical: 'badge-red' };
      const rows = as.length ? as.map(a => `<tr><td>${a.data}</td><td>${a.acao}</td><td><span class="badge badge-gray">${a.categoria}</span></td><td><span class="badge ${sevMap[a.severidade] || 'badge-gray'}">${a.severidade}</span></td><td>${a.utilizador}</td></tr>`).join('') : `<tr><td colspan="5" class="dash-empty">Sem registos.</td></tr>`;
      return tbl2(['Data', 'Ação', 'Categoria', 'Severidade', 'Utilizador'], rows, 'Log de auditoria (últimos 100)');
    }
    function renderGestaoConta() {
      const u = state.user;
      return `<div class="dcard"><h3>A minha conta</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
            <div><label class="dlabel">Nome</label><input class="dinput" id="c_nome" value="${u.nome || ''}"></div>
            <div><label class="dlabel">Email</label><input class="dinput" type="email" id="c_email" value="${u.email || ''}"></div>
            <div><label class="dlabel">Perfil</label><input class="dinput" value="${u.perfil}" disabled style="background:var(--slate-100);color:var(--slate-500)"></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="guardarConta()">Guardar alterações</button></div>`;
    }
    function setAdminSection(id) {
      if (id === 'mensagens') { carregarConversas(); return; }
      state.adminSection = id; render();
    }
    function carregarConversas() {
      postDjango({ action: 'chat_clientes_lista' }, (d) => { state.chatConversas = d.dados || []; state.chatAberta = null; state.adminSection = 'mensagens'; render(); });
    }
    function abrirConversa(clientId) {
      postDjango({ action: 'chat_cliente', client_id: clientId }, (d) => { const dd = d.dados || {}; state.chatAberta = { id: dd.conversation_id, client_id: clientId, mensagens: dd.mensagens || [] }; state.adminSection = 'mensagens'; render(); });
    }
    function enviarMensagemStaff() {
      const texto = val('smsg_input');
      if (!texto || !state.chatAberta) return;
      postDjango({ action: 'enviar_mensagem', conversation_id: state.chatAberta.id, sender_id: state.user.id, content: texto }, () => { abrirConversa(state.chatAberta.id); });
    }
    function renderChatAdmin() {
      const convs = state.chatConversas || [];
      const list = convs.length ? convs.map(c => `<div onclick="abrirConversa(${c.client_id})" style="padding:0.75rem 1rem;border-bottom:1px solid var(--slate-100);cursor:pointer;${state.chatAberta && state.chatAberta.client_id === c.client_id ? 'background:var(--slate-50)' : ''}"><div style="font-weight:600;color:#0f172a">${c.cliente}</div><div style="font-size:0.78rem;color:var(--slate-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.ultima || 'Sem mensagens ainda'}</div></div>`).join('') : `<div class="dash-empty">Sem clientes.</div>`;
      let painel;
      if (state.chatAberta) {
        painel = `<div style="flex:1;overflow-y:auto;background:var(--slate-50);border-radius:8px;padding:1rem;margin-bottom:0.75rem">${bolhasChat(state.chatAberta.mensagens)}</div>
          <div style="display:flex;gap:0.5rem"><input class="dinput" id="smsg_input" placeholder="Responder ao cliente..." onkeydown="if(event.key==='Enter')enviarMensagemStaff()"><button class="btn btn-primary btn-sm" onclick="enviarMensagemStaff()">Enviar</button></div>`;
      } else {
        painel = `<div class="dash-empty" style="margin:auto">Seleciona uma conversa à esquerda.</div>`;
      }
      return `<div style="display:grid;grid-template-columns:250px 1fr;gap:1rem;height:64vh">
          <div class="table-wrap" style="overflow-y:auto;margin:0">${list}</div>
          <div class="dcard" style="display:flex;flex-direction:column;margin:0">${painel}</div>
        </div>`;
    }
    // ===== Chat interno de um ticket (ticket_comments) =====
    function abrirTicketChat(ticketId) {
      postDjango({ action: 'ticket_comentarios', ticket_id: ticketId }, (d) => { state.ticketChat = { ticket_id: ticketId, comentarios: d.dados || [] }; render(); });
    }
    function fecharTicketChat() { state.ticketChat = null; render(); }
    function enviarComentarioTicket() {
      const texto = val('tc_input');
      if (!texto || !state.ticketChat) return;
      postDjango({ action: 'ticket_comentar', ticket_id: state.ticketChat.ticket_id, user_id: state.user.id, content: texto }, () => { abrirTicketChat(state.ticketChat.ticket_id); });
    }
    function renderTicketModal() {
      if (!state.ticketChat) return '';
      const c = state.ticketChat;
      const bolhas = (c.comentarios && c.comentarios.length) ? c.comentarios.map(m => {
        const meu = m.autor_id === state.user.id;
        return `<div style="display:flex;justify-content:${meu ? 'flex-end' : 'flex-start'};margin-bottom:0.5rem"><div style="max-width:76%;padding:0.5rem 0.8rem;border-radius:10px;background:${meu ? 'var(--yellow-light)' : '#fff'};border:1px solid var(--slate-200)"><div style="font-size:0.88rem;color:#0f172a">${m.texto}</div><div style="font-size:0.66rem;color:var(--slate-500);margin-top:0.2rem">${m.autor} · ${m.data}</div></div></div>`;
      }).join('') : `<div class="dash-empty">Sem mensagens neste ticket. Escreve a primeira.</div>`;
      return `<div onclick="if(event.target===this)fecharTicketChat()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem">
          <div style="background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden">
            <div style="padding:1rem 1.25rem;border-bottom:1px solid var(--slate-200);display:flex;justify-content:space-between;align-items:center"><h3 style="color:#0f172a">Ticket #${c.ticket_id} — Conversa</h3><button class="btn btn-sm btn-outline-dark" onclick="fecharTicketChat()">Fechar</button></div>
            <div style="flex:1;overflow-y:auto;padding:1rem;background:var(--slate-50)">${bolhas}</div>
            <div style="display:flex;gap:0.5rem;padding:0.85rem 1.25rem;border-top:1px solid var(--slate-200)"><input class="dinput" id="tc_input" placeholder="Escreve uma mensagem..." onkeydown="if(event.key==='Enter')enviarComentarioTicket()"><button class="btn btn-primary btn-sm" onclick="enviarComentarioTicket()">Enviar</button></div>
          </div>
        </div>`;
    }
    function postDjango(payload, onOk) {
      fetch('', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, body: JSON.stringify(payload) })
        .then(r => r.json()).then(d => { if (d.status === 'success') onOk(d); else toast(d.message || 'Erro na operação.', 'error'); })
        .catch(() => toast('Erro interno do servidor Django.', 'error'));
    }
    function recarregarGestao(section) {
      postDjango({ action: 'dados_gestao' }, (d) => { state.gestaoData = d.dados || state.gestaoData; state.adminSection = section; render(); });
    }
    function guardarUtilizador() {
      const id = document.getElementById('u_id').value;
      const nome = document.getElementById('u_nome').value, email = document.getElementById('u_email').value, perfil = document.getElementById('u_perfil').value;
      if (!nome || !email) { toast('Preenche nome e email.', 'error'); return; }
      if (id) { postDjango({ action: 'atualizar_utilizador', id, nome, email, perfil }, () => { toast('Utilizador atualizado.'); recarregarGestao('utilizadores'); }); }
      else {
        const password = document.getElementById('u_pass').value;
        if (!password) { toast('Define uma palavra-passe.', 'error'); return; }
        postDjango({ action: 'criar_utilizador', nome, email, password, perfil }, () => { toast('Utilizador criado.'); recarregarGestao('utilizadores'); });
      }
    }
    function editarUtilizador(id) {
      const u = ((state.gestaoData && state.gestaoData.utilizadores) || []).find(x => x.id === id); if (!u) return;
      state.adminSection = 'utilizadores'; render();
      setTimeout(() => {
        document.getElementById('u_id').value = u.id;
        document.getElementById('u_nome').value = u.nome;
        document.getElementById('u_email').value = u.email;
        document.getElementById('u_perfil').value = u.perfil;
        document.getElementById('u_form_title').innerText = 'Editar utilizador';
        const pg = document.getElementById('u_pass_group'); if (pg) pg.style.display = 'none';
      }, 0);
    }
    function eliminarUtilizador(id) {
      if (!confirm('Apagar este utilizador?')) return;
      postDjango({ action: 'eliminar_utilizador', id }, () => { toast('Utilizador apagado.'); recarregarGestao('utilizadores'); });
    }
    function atualizarEstadoTicket(id, estado) {
      postDjango({ action: 'atualizar_estado_ticket', id, estado }, () => { toast('Estado do ticket atualizado.'); recarregarGestao('tickets'); });
    }
    function atualizarEstadoPedido(id, estado) {
      postDjango({ action: 'atualizar_estado_pedido', id, estado }, () => { toast('Estado do pedido atualizado.'); recarregarGestao('pedidos'); });
    }
    function eliminarDocumento(id) {
      if (!confirm('Apagar este documento?')) return;
      postDjango({ action: 'eliminar_documento', id }, () => { toast('Documento apagado.'); recarregarGestao('documentos'); });
    }
    function atualizarEstadoServico(id, estado) {
      postDjango({ action: 'atualizar_estado_servico', id, estado }, () => { toast('Estado do serviço atualizado.'); recarregarGestao('servicos'); });
    }
    function marcarContactoLido(id) {
      postDjango({ action: 'marcar_contacto_lido', id }, () => { toast('Contacto marcado como lido.'); recarregarGestao('contactos'); });
    }

    // ============================================================
    // PROCESSAMENTO DE SUBMISSÕES POST (CONEXÃO AJAX AO DJANGO)
    // ============================================================
    function handleContact(e) {
      e.preventDefault();
      const payload = {
        action: 'contacto',
        name: document.getElementById('c_name').value,
        email: document.getElementById('c_email').value,
        message: document.getElementById('c_msg').value
      };

      fetch('', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          toast('Obrigado! Mensagem de contacto gravada no PostgreSQL.');
          document.getElementById('contactForm').reset();
        } else {
          toast('Falha ao registar dados na tabela.', 'error');
        }
      })
      .catch(() => toast('Erro de comunicação de rede.', 'error'));
    }

    // Conclui o login (comum ao fluxo com e sem 2FA)
    function finalizarLogin(user) {
      state.user = user;
      state.pending2fa = null;
      toast(`Autenticado com perfil: ${user.perfil}`);
      if (user.perfil === 'Cliente') {
        state.clientSection = 'dashboard';
        fetch('', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, body: JSON.stringify({ action: 'dados_cliente', id: user.id }) })
          .then(r => r.json())
          .then(d => { state.clienteData = d.dados || null; navigate('client-dashboard'); })
          .catch(() => navigate('client-dashboard'));
      } else {
        state.adminSection = 'dashboard';
        fetch('', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, body: JSON.stringify({ action: 'dados_gestao' }) })
          .then(r => r.json())
          .then(d => { state.gestaoData = d.dados || null; navigate('admin-dashboard'); })
          .catch(() => navigate('admin-dashboard'));
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const payload = {
        action: 'login',
        email: document.getElementById('l_email').value,
        password: document.getElementById('l_pass').value
      };
      fetch('', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          if (data.user.needs2fa) { state.pending2fa = data.user; render(); }
          else finalizarLogin(data.user);
        } else {
          toast(data.message || 'Credenciais rejeitadas pelo sistema.', 'error');
        }
      })
      .catch(() => toast('Erro interno do servidor Django.', 'error'));
    }

    function handleVerify2fa(e) {
      e.preventDefault();
      const payload = { action: 'verify_2fa', id: state.pending2fa.id, word: document.getElementById('l_word').value };
      fetch('', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') finalizarLogin(data.user);
        else toast(data.message || 'Palavra de segurança incorreta.', 'error');
      })
      .catch(() => toast('Erro interno do servidor Django.', 'error'));
    }

    // INICIALIZAÇÃO SPA
    function render() {
      const app = document.getElementById('app');
      const p = state.currentPage;
      // Modo dashboard: sidebar escura em ecrã inteiro (esconde header/footer do site)
      const emDashboard = (p === 'client-dashboard' || p === 'admin-dashboard') && state.user;
      document.body.classList.toggle('dash-mode', !!emDashboard);
      if (p === 'home') app.innerHTML = renderHome();
      else if (p === 'about') app.innerHTML = renderAbout();
      else if (p === 'services') app.innerHTML = renderServices();
      else if (p === 'nis2') app.innerHTML = renderNIS2();
      else if (p === 'news') app.innerHTML = renderNews();
      else if (p === 'contact') app.innerHTML = renderContact();
      else if (p === 'login') app.innerHTML = renderLogin();
      else if (p === 'client-dashboard') {
        if (!state.user || state.user.perfil !== 'Cliente') { navigate('login'); return; }
        app.innerHTML = renderClientDashboard();
      }
      else if (p === 'admin-dashboard') {
        if (!state.user || state.user.perfil === 'Cliente') { navigate('login'); return; }
        app.innerHTML = renderAdminDashboard();
      }
    }

    // Arranque inicial do ecrã
    renderNav();
    render();
  </script>
</body>
</html>
